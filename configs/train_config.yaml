# Training Configuration for OTalign

# -- Experiment Settings --
log_dir: "work/logs"
run_name: "esm1b-lora-finetune-2"
report_to: "wandb"

# -- Checkpoint Settings --
checkpoint_dir: "work/checkpoints"
save_checkpoint_freq: 1 # Save every N epochs
resume_from_checkpoint: null # Path to a .pt file to resume from, or null

# -- Model Settings --
model_name: "ESM1b" # From otalign.models.plm_adaptors.MODEL_REGISTRY
lora:
  r: 8
  lora_alpha: 16
  dropout: 0.1
  target_modules: # Module names to apply LoRA to (specific to the model architecture)
    - "query"
    - "key"
    - "value"
    - "dense"

# -- Data Settings --
data_root: "work/cath_dataset"
num_workers: 4
max_len1: 1024
max_len2: 1024

# -- Training Settings --
train_full_head: true # Whether to train the full language model head or just LoRA adapters
epochs: 100
batch_size: 2
lr: 1.0e-4
log_interval: 10
gradient_accumulation_steps: 8

# -- Evaluation Settings --
eval_before_train: true # Whether to run an evaluation before starting the training
eval_band_width: 2

# -- Loss Function Settings --
loss:
  lambda_pos: 0.1 # Sparsity regularization for positive pairs
  lambda_neg: 1.0 # Emptiness regularization for negative pairs
  lambda_mlm: 1.0 # Weight for the Masked Language Model loss

# -- UOT Settings --
uot:
  reg: 0.1 # Entropy regularization
  reg_m: 1.0 # Marginal relaxation
  num_iter: 1_000 # Sinkhorn iterations
