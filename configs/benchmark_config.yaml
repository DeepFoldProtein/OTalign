# 5. Plotting Configuration
# Defines the plots to be generated for each test group.
# The top-level keys must match the keys in the 'tests' section.

# 5.1. Global Plot Style Defaults
# These settings apply to all plots unless overridden in a specific plot's configuration.
plot_style:
  figsize: [8, 6]
  dpi: 300
  fontsize:
    title: 18
    xlabel: 14
    ylabel: 14
    xtick: 14
    ytick: 14
    legend: 12
    legend_title: 12
  legend:
    ncol: 1
    position: "outside"
  fontfamily: "serif" # e.g., "serif", "sans-serif", "monospace"

plotting:
  sabmark-sup:
    plots:
      metrics_box:
        style:
          figsize: [12, 6]
        type: "boxplot"
        title: "SABmark (Superfamlies) Benchmark"
        metrics: ["f1", "recall", "precision"]
      recall_bar:
        type: "barplot"
        title: "SABmark (Superfamlies) Recall Comparison"
        metrics: ["recall"]
  sabmark-twi:
    plots:
      metrics_box:
        style:
          figsize: [12, 6]
        type: "boxplot"
        title: "SABmark (Twilights) Benchmark"
        metrics: ["f1", "recall", "precision"]
      recall_bar:
        type: "barplot"
        title: "SABmark (Twilights) Recall Comparison"
        metrics: ["recall"]
  malidup:
    plots:
      metrics_box:
        style:
          figsize: [12, 6]
        type: "boxplot"
        title: "Malidup Benchmark"
        metrics: ["f1", "recall", "precision"]
      malidup_f1_bar:
        type: "barplot"
        title: "Malidup Benchmark (F1 Score)"
        metrics: ["f1"]
  malisam:
    plots:
      metrics_box:
        style:
          figsize: [12, 6]
        type: "boxplot"
        title: "Malisam Benchmark"
        metrics: ["f1", "recall", "precision"]
      f1_bar:
        type: "barplot"
        title: "Malisam Benchmark (F1 Score)"
        metrics: ["f1"]

  finetune-sabmark-sup:
