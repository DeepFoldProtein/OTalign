# OTalign Benchmark Suite Configuration

# 1. Global Paths and Settings
paths:
  # Root directory for storing raw benchmark results
  results_dir: "out/results"
  # results_dir: "/gpfs/deepfold/work/otalign/eval/results"
  # Root directory for caching embeddings and other intermediate data
  cache_dir: "out/cache"
  # Root directory for saving generated plots
  plots_dir: "out/plots"
  # Path to the HHalign executable
  hhalign_bin: "hhalign"
  # Path to the NWalign executable
  nwalign_bin: "NWalign"
  # Path to the DeepBLAST checkpoint
  deepblast_checkpoint: "data/deepblast/deepblast-v3.ckpt"
  # pLM-BLAST (git submodule)
  plmblast_root: "third_party/plmblast"
  # DEDAL (git submodule)
  dedal_root: "third_party/dedal"

# 2. Datasets
# Define the benchmark datasets to be used.
# The identifier should be a HuggingFace dataset identifier.
datasets:
  sabmark_sup_fp:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "sup_fp"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-sup_fp/hhm"
  sabmark_twi_fp:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "twi_fp"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-twi_fp/hhm"
  sabmark_sup:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "sup"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-sup_fp/hhm"
  sabmark_twi:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "twi"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-twi_fp/hhm"
  malidup:
    id: "DeepFoldProtein/malidup-dataset"
    config: "all"
    split: "test"
    hhm_dir: "data/hhsuite/malidup/hhm"
  malisam:
    id: "DeepFoldProtein/malisam-dataset"
    config: "all"
    split: "test"
    hhm_dir: "data/hhsuite/malisam/hhm"
  
  # ECOD30 Hard benchmark (pLM-BLAST paper style, 30% seq-id matching paper)
  ecod30_hard:
    data_dir: "data/ecod30_hard"
    hhm_dir: "data/hhsuite/ecod30_hard/hhm"  # used by ecod_hhalign_global (prebuilt hhblits HHMs)
    description: "ECOD30 Hard benchmark (pLM-BLAST paper): 300 H-groups × 5 domains, 30% seq-id clustering"

# 3. Models and Tools
# Define all models and alignment tools to be benchmarked.
models:
  # --- OTalign Models ---
  otalign_esm1b:
    tool: "otalign"
    plm: "ESM1b_33_650M"
    label: "OTalign (ESM-1b)"
    color: "#2171b5"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2:
    tool: "otalign"
    plm: "ESM2_33_650M"
    label: "OTalign (ESM-2 650M)"
    color: "#3182bd"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankhcl:
    tool: "otalign"
    plm: "AnkhCL"
    label: "OTalign (AnkhCL)"
    color: "#238b45"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh_base:
    tool: "otalign"
    plm: "Ankh_Base"
    label: "OTalign (Ankh-Base)"
    color: "#31a354"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh_large:
    tool: "otalign"
    plm: "Ankh_Large"
    label: "OTalign (Ankh-Large)"
    color: "#74c476"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh3_large:
    tool: "otalign"
    plm: "Ankh3_Large"
    label: "OTalign (Ankh3-Large)"
    color: "#41ab5d"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh3_xl:
    tool: "otalign"
    plm: "Ankh3_XL"
    label: "OTalign (Ankh3-XL)"
    color: "#006d2c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 8
  otalign_prott5:
    tool: "otalign"
    plm: "ProtT5_XL_UniRef50"
    label: "OTalign (ProtT5-XL)"
    color: "#66c2a5"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2_6_8m:
    tool: "otalign"
    plm: "ESM2_6_8M"
    label: "OTalign (ESM-2 8M)"
    color: "#c6dbef"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2_12_35m:
    tool: "otalign"
    plm: "ESM2_12_35M"
    label: "OTalign (ESM-2 35M)"
    color: "#9ecae1"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2_30_150m:
    tool: "otalign"
    plm: "ESM2_30_150M"
    label: "OTalign (ESM-2 150M)"
    color: "#6baed6"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2_36_3b:
    tool: "otalign"
    plm: "ESM2_36_3B"
    label: "OTalign (ESM-2 3B)"
    color: "#4292c6"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_proteinglm_100b_int4:
    tool: "otalign"
    plm: "ProteinGLM_100B_INT4"
    label: "OTalign (ProteinGLM 100B)"
    color: "#fd8d3c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16

  # --- Trained OTalign Model ---
  otalign_esm1b_lora_ft2_2:
    tool: "otalign"
    checkpoint_path: "work/checkpoints/esm1b-lora-finetune-2/checkpoint-epoch-2" # Checkpoint path
    base_model: "ESM1b_33_650M"
    label: "OTalign (ESM-1b-LoRA-FT2)"
    color: "#08519c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  esm1b-lora-finetune-ot-head-1:
    tool: "otalign"
    checkpoint_path: "work/checkpoints/esm1b-lora-finetune-ot-head-1/checkpoint-epoch-2" # Checkpoint path
    base_model: "ESM1b_33_650M"
    label: "OTalign (ESM-1b-LoRA-FT-H1)"
    color: "#08519c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16

  # --- Baseline Models ---
  otalign-crf-ankh-large:
    tool: "otalign-crf"
    plm: "Ankh_Large"
    label: "OTalign-CRF (Ankh-Large)"
    color: "#ff5f0e"
    params:
      align_batch_size: 16
      reg_init: 1.0
      reg_final: 0.01
      reg_steps: 5
      reg_m: 1.0
  otalign-crf-prott5:
    tool: "otalign-crf"
    plm: "ProtT5_XL_UniRef50"
    label: "OTalign-CRF (ProtT5-XL)"
    color: "#ff1f0e"
    params:
      align_batch_size: 16
      reg_init: 1.0
      reg_final: 0.01
      reg_steps: 5
      reg_m: 1.0

  # --- Baseline Models ---
  hhalign:
    tool: "hhalign"
    label: "HHalign"
    color: "#808080"
    params:
      mode: "global"
  nwalign:
    tool: "nwalign"
    label: "NWalign"
    color: "#A9A9A9"
    params:
      glocal: 0 # 0 for global alignment
  deepblast:
    tool: "deepblast"
    label: "DeepBLAST (NW)"
    color: "#d9ead3"
    params:
      alignment_mode: "needleman-wunsch"

  # --- PLMAlign Models ---
  plmalign_prott5_global:
    tool: "plmalign"
    plm: "ProtT5_XL_UniRef50"
    label: "PLMAlign (ProtT5-XL, Global)"
    color: "#ffd966"
    params:
      alignment_mode: "global"
      plm_model: "ProtT5_XL_UniRef50"

  plmalign_prott5_local:
    tool: "plmalign"
    plm: "ProtT5_XL_UniRef50"
    label: "PLMAlign (ProtT5-XL, Local)"
    color: "#f9cb9c"
    params:
      alignment_mode: "local"
      plm_model: "ProtT5_XL_UniRef50"

  # --- pLM-BLAST (https://github.com/labstructbioinf/pLM-BLAST) ---
  plmblast_prott5:
    tool: "plmblast"
    plm: "ProtT5_XL_UniRef50"
    label: "pLM-BLAST (ProtT5-XL)"
    color: "#e78ac3"
    params:
      global_alignment: true  # Global performs better than local on this benchmark (0.07 vs 0.05 F1)

  # --- DEDAL (https://github.com/DeepFoldProtein/dedal-fork) ---
  dedal:
    tool: "dedal"
    label: "DEDAL"
    color: "#9ecae1"
    model_url: "https://tfhub.dev/google/dedal/3"
    params:
      max_length: 512
      use_gpu: true  # Set to false for CPU-only (slower but avoids PTX errors on some GPUs)

  # --- EBA (https://github.com/DeepFoldProtein/EBA) ---
  eba_prott5:
    tool: "eba"
    label: "EBA (ProtT5)"
    color: "#fdae6b"
    params:
      plm: "ProtT5"
      l: 1.0  # similarity matrix regularization

  # --- ECOD Homolog Detection (H-group / X-group, paper convention) ---
  ecod_plmblast_prott5:
    tool: "ecod_homolog"
    plm: "ProtT5_XL_UniRef50"
    label: "pLM-BLAST (ProtT5) - ECOD"
    color: "#e78ac3"
    params:
      global_alignment: true

  # --- OTalign ECOD Homolog Detection ---
  ecod_otalign_ankh_large:
    tool: "ecod_homolog"
    plm: "Ankh_Large"
    label: "OTalign (Ankh-Large) - ECOD"
    color: "#74c476"
    params:
      score_method: "mean_cosine"
      reg: 0.1
      lambda1: 1.0
      lambda2: 1.0
      num_iter: 1000
      align_batch_size: 16
  ecod_otalign_prott5:
    tool: "ecod_homolog"
    plm: "ProtT5_XL_UniRef50"
    label: "OTalign (ProtT5) - ECOD"
    color: "#66c2a5"
    params:
      score_method: "mean_cosine"
      reg: 0.1
      lambda1: 1.0
      lambda2: 1.0
      num_iter: 1000
      align_batch_size: 16
  ecod_otalign_esm2:
    tool: "ecod_homolog"
    plm: "ESM2_33_650M"
    label: "OTalign (ESM-2 650M) - ECOD"
    color: "#3182bd"
    params:
      score_method: "mean_cosine"
      reg: 0.1
      lambda1: 1.0
      lambda2: 1.0
      num_iter: 1000
      align_batch_size: 16

  # --- EBA ECOD Homolog Detection ---
  ecod_eba_prott5:
    tool: "ecod_homolog"
    plm: "ProtT5"
    label: "EBA (ProtT5) - ECOD"
    color: "#fdae6b"
    params:
      eba_score_method: "EBA_min"
      l_sim: 1.0

  # --- DEDAL ECOD Homolog Detection ---
  ecod_dedal:
    tool: "ecod_homolog"
    label: "DEDAL - ECOD"
    color: "#9ecae1"
    params:
      dedal_score_method: "sw_scores"
      model_url: "https://tfhub.dev/google/dedal/3"
      max_length: 512
      use_gpu: false

  # --- HHalign ECOD Homolog Detection (global mode, prebuilt hhblits profiles) ---
  ecod_hhalign_global:
    tool: "ecod_homolog"
    label: "HHalign (global) - ECOD"
    color: "#808080"
    params:
      hhalign_mode: "global"
      hhmake_bin: "hhmake"
      timeout: 120

