        metrics: ["recall"]
  finetune-sabmark-twi:
    plots:
      - name: "sabmark_metrics_box"
        type: "boxplot"
        title: "SABmark (Twilights) Benchmark"
        metrics: ["recall", "precision", "f1", "jaccard"]
      - name: "sabmark_recall_bar"
