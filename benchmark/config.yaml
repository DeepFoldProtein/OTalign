      - name: "malisam_metrics_box"
        type: "boxplot"
        title: "Malisam Benchmark"
        metrics: ["recall", "precision", "f1", "jaccard"]
      - name: "malisam_f1_bar"
        type: "barplot"
        title: "Malisam Benchmark (F1 Score)"
        metrics: ["f1"]

  finetune-sabmark-sup:
    plots:
      - name: "sabmark_metrics_box"
        type: "boxplot"
        title: "SABmark (Superfamlies) Benchmark"
        metrics: ["recall", "precision", "f1", "jaccard"]
      - name: "sabmark_recall_bar"
