# OTalign Benchmark Suite Configuration

# 1. Global Paths and Settings
paths:
  # Root directory for storing raw benchmark results
  results_dir: "out/results"
  # Root directory for caching embeddings and other intermediate data
  cache_dir: "out/cache"
  # Root directory for saving generated plots
  plots_dir: "out/plots"
  # Path to the HHalign executable
  hhalign_bin: "hhalign"
  # Path to the NWalign executable
  nwalign_bin: "NWalign"
  # Path to the DeepBLAST checkpoint
  deepblast_checkpoint: "data/deepblast/deepblast-v3.ckpt"

# 2. Datasets
# Define the benchmark datasets to be used.
# The identifier should be a HuggingFace dataset identifier.
datasets:
  sabmark_sup:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "sup"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-sup_fp/hhm"
  sabmark_twi:
    id: "DeepFoldProtein/SABmark-dataset"
    config: "twi"
    split: "test"
    hhm_dir: "data/hhsuite/sabmark-twi_fp/hhm"
  malidup:
    id: "DeepFoldProtein/malidup-dataset"
    config: "all"
    split: "test"
    hhm_dir: "data/hhsuite/malidup/hhm"
  malisam:
    id: "DeepFoldProtein/malisam-dataset"
    config: "all"
    split: "test"
    hhm_dir: "data/hhsuite/malisam/hhm"

# 3. Models and Tools
# Define all models and alignment tools to be benchmarked.
models:
  # --- OTalign Models ---
  otalign_esm1b:
    tool: "otalign"
    plm: "ESM1b_33_650M"
    label: "OTalign (ESM-1b)"
    color: "#2171b5"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_esm2:
    tool: "otalign"
    plm: "ESM2_33_650M"
    label: "OTalign (ESM-2)"
    color: "#6baed6"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankhcl:
    tool: "otalign"
    plm: "AnkhCL"
    label: "OTalign (AnkhCL)"
    color: "#238b45"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh_base:
    tool: "otalign"
    plm: "Ankh_Base"
    label: "OTalign (Ankh-Base)"
    color: "#31a354"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh_large:
    tool: "otalign"
    plm: "Ankh_Large"
    label: "OTalign (Ankh-Large)"
    color: "#74c476"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh3_large:
    tool: "otalign"
    plm: "Ankh3_Large"
    label: "OTalign (Ankh3-Large)"
    color: "#41ab5d"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_ankh3_xl:
    tool: "otalign"
    plm: "Ankh3_XL"
    label: "OTalign (Ankh3-XL)"
    color: "#006d2c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  otalign_prott5:
    tool: "otalign"
    plm: "ProtT5_XL_UniRef50"
    label: "OTalign (ProtT5)"
    color: "#66c2a5"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16

  # --- Trained OTalign Model ---
  otalign_esm1b_lora_ft2_2:
    tool: "otalign"
    checkpoint_path: "work/checkpoints/esm1b-lora-finetune-2/checkpoint-epoch-2" # Checkpoint path
    base_model: "ESM1b_33_650M"
    label: "OTalign (ESM-1b-LoRA-FT2)"
    color: "#08519c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16
  esm1b-lora-finetune-ot-head-1:
    tool: "otalign"
    checkpoint_path: "work/checkpoints/esm1b-lora-finetune-ot-head-1/checkpoint-epoch-2" # Checkpoint path
    base_model: "ESM1b_33_650M"
    label: "OTalign (ESM-1b-LoRA-FT-H1)"
    color: "#08519c"
    params:
      epsilon: 0.1
      tau: 1.0
      align_batch_size: 16

  # --- Baseline Models ---
  hhalign:
    tool: "hhalign"
    label: "HHalign"
    color: "#808080"
    params:
      mode: "global"
  nwalign:
    tool: "nwalign"
    label: "NWalign"
    color: "#A9A9A9"
    params:
      glocal: 0 # 0 for global alignment
  deepblast:
    tool: "deepblast"
    label: "DeepBLAST (NW)"
    color: "#d9ead3"
    params:
      alignment_mode: "needleman-wunsch"
  
  # --- PLMAlign Models ---
  plmalign_prott5_global:
    tool: "plmalign"
    plm: "ProtT5_XL_UniRef50"
    label: "PLMAlign (ProtT5-Global)"
    color: "#ffd966"
    params:
      alignment_mode: "global"
      plm_model: "ProtT5_XL_UniRef50"
  
  plmalign_prott5_local:
    tool: "plmalign"
    plm: "ProtT5_XL_UniRef50"
    label: "PLMAlign (ProtT5-Local)"
    color: "#f9cb9c"
    params:
      alignment_mode: "local"
      plm_model: "ProtT5_XL_UniRef50"

# 4. Benchmark Tests
# Define which models to run on which datasets.
# This allows for flexible and targeted benchmarking.
tests:
  malidup:
    datasets: ["malidup"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "deepblast"
      - "plmalign_prott5_global"
      - "plmalign_prott5_local"
      - "otalign_esm2"
      - "otalign_esm1b"
  malisam:
    datasets: ["malisam"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "deepblast"
      - "plmalign_prott5_global"
      - "plmalign_prott5_local"
      - "otalign_esm2"
      - "otalign_esm1b"
  sabmark-sup:
    datasets: ["sabmark_sup"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "deepblast"
      - "plmalign_prott5_global"
      - "plmalign_prott5_local"
      - "otalign_esm2"
      - "otalign_esm1b"
  sabmark-twi:
    datasets: ["sabmark_twi"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "deepblast"
      - "plmalign_prott5_global"
      - "plmalign_prott5_local"
      - "otalign_esm2"
      - "otalign_esm1b"

  finetune-sabmark-sup:
    datasets: ["sabmark_sup"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "otalign_esm2"
      - "otalign_esm1b"
      - "esm1b-lora-finetune-ot-head-1"
  finetune-sabmark-twi:
    datasets: ["sabmark_twi"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "otalign_esm2"
      - "otalign_esm1b"
      - "esm1b-lora-finetune-ot-head-1"
  finetune-malidup:
    datasets: ["malidup"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "otalign_esm2"
      - "otalign_esm1b"
      - "esm1b-lora-finetune-ot-head-1"
  finetune-malisam:
    datasets: ["malisam"]
    models:
      - "nwalign"
      - "hhalign"
      - "otalign_ankhcl"
      - "otalign_ankh_base"
      - "otalign_ankh_large"
      - "otalign_ankh3_large"
      - "otalign_ankh3_xl"
      - "otalign_prott5"
      - "otalign_esm2"
      - "otalign_esm1b"
      - "esm1b-lora-finetune-ot-head-1"

# 5. Plotting Configuration
# Defines the plots to be generated for each test group.
# The top-level keys must match the keys in the 'tests' section.
plotting:
  sabmark-sup:
    plots:
      - name: "sabmark_metrics_box"
        type: "boxplot"
        title: "SABmark (Superfamlies) Benchmark"
        metrics: ["recall", "precision", "f1", "jaccard"]
      - name: "sabmark_recall_bar"
        type: "barplot"
        title: "SABmark (Superfamlies) Recall Comparison"
        metrics: ["recall"]
  sabmark-twi:
    plots:
      - name: "sabmark_metrics_box"
        type: "boxplot"
        title: "SABmark (Twilights) Benchmark"
